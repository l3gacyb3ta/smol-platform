<!-- The masthead at 64px: red field, white keyline frame, the letter. Square
     corners, flat fill, and a system font stack now that no webfont is loaded. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#ec3750"/>
  <rect x="4.5" y="4.5" width="55" height="55" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text
    x="32" y="47"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="40"
    font-weight="700"
    fill="#ffffff"
  >s</text>
</svg>
